[package]
name = "honey"
version = "0.1.0"
edition = "2024"
authors = ["AXIOM"]
# dont add a description

[[bin]]
# Thin launcher: the shipped `honey`. No V8, ~1MB — `honey run` pays almost
# nothing for exec; every other command execv's into honey-full below.
name = "honey"
path = "src/bin/honey.rs"

[[bin]]
# The full CLI + engine (all commands, inline fallback execution, daemon).
name = "honey-full"
path = "src/bin/honey-full.rs"

[[bin]]
name = "hxney"
path = "src/bin/hxney.rs"

[[bin]]
# One-off package executor, full-fat path (npm install fallback, scoped
# packages, offline cold runs). The shipped `hxney` launcher execv's here
# for anything off the warm daemon path.
name = "hxney-full"
path = "src/bin/hxney-full.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "gzip", "brotli", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
futures = "0.3"
# Newest upstream, always: no version pin. Whatever crates.io has latest.
# (v8 itself comes in through deno_core::v8, version-matched by deno_core.)
deno_core = "0"
# Crate dependency of deno_core's ModuleLoader (JsErrorBox lives here,
# deno_core does not re-export it).
deno_error = "0.7"
oxc_parser = "0.40"
oxc_transformer = "0.40"
oxc_ast = "0.40"
oxc_sourcemap = "1.0"
oxc_semantic = "0.40"
oxc_codegen = "0.40"
oxc_allocator = "0.40"
oxc_span = "0.40"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true