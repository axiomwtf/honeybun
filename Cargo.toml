[package]
name = "honey"
version = "0.1.0"
edition = "2024"
authors = ["AXIOM"]
description = "Up to 14x faster than Bun. Up to 100x faster than Node. One binary. One toolchain."

[[bin]]
name = "honey"
path = "src/main.rs"

[[bin]]
name = "hxney"
path = "src/bin/hxney.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "gzip", "brotli", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
futures = "0.3"
v8 = "0.101"
deno_core = "0.300"
oxc_parser = "0.40"
oxc_transformer = "0.40"
oxc_ast = "0.40"
oxc_sourcemap = "1.0"
oxc_semantic = "0.40"
oxc_codegen = "0.40"
oxc_allocator = "0.40"
oxc_span = "0.40"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true