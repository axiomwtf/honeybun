# honey build configuration.
#
# Goals: a non-PIE, natively-tuned final binary, with native CPU codegen
# applied to every dependency compiled from source (V8's Rust-facing glue,
# deno_core, oxc, tokio, ...). No-PIE removes PIE setup and ASLR page-fault
# costs on the hot exec path: the CLI's daemon round-trip is measured in
# microseconds while fork+exec+dynamic-linking is the single biggest cost of
# every one-shot invocation.
#
# Division of labour:
#   * HERE: per-target codegen flags (-C target-cpu=native) for ALL crates —
#     including every dependency — but only flags that are valid for both
#     host artifacts (proc-macro/build-script dylibs) and target artifacts.
#   * Cargo.toml [profile.release]: LTO, opt-level, codegen-units=1, strip.
#   * build.rs (cargo:rustc-link-arg-bins): executable-only linker flags
#     (-no-pie, -z now, -z noseparate-code). These must NOT live here —
#     global link-args also land in rustc's host proc-macro dylib links,
#     where -no-pie + -shared pulls in crt1.o and breaks the build.
#
# Note: `-C prefer-pie=no` is nightly-only; on stable the same effect comes
# from build.rs's -no-pie on the final binaries.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# aarch64 macOS requires PIE (macOS arm64 hard requirement); keep native
# tuning only.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
